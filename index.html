<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Tags para funcionar como App Nativo no iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Divisor de Fatura</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para ler a fatura do Nubank em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF para exportar o relatório -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl">
        <!-- Header -->
        <div class="bg-[#8A05BE] text-white p-6 rounded-b-[2rem] shadow-lg">
            <h1 class="text-2xl font-bold tracking-tight">Divisor de Fatura</h1>
            <p class="text-sm text-purple-200 mt-1 font-medium">Organize os gastos rapidinho</p>
        </div>

        <div class="p-6 space-y-6" id="setup-screen">
            <!-- Configuração de Nomes -->
            <div class="space-y-3">
                <h2 class="text-lg font-bold text-gray-800">1. Defina as Categorias</h2>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="cat1" value="Meu Gasto" class="border-2 border-gray-200 rounded-xl p-3 w-full font-medium outline-none focus:border-[#8A05BE] focus:ring-1 focus:ring-[#8A05BE] transition" placeholder="Ex: Wilson">
                    <input type="text" id="cat2" value="Casamento" class="border-2 border-gray-200 rounded-xl p-3 w-full font-medium outline-none focus:border-[#8A05BE] focus:ring-1 focus:ring-[#8A05BE] transition" placeholder="Ex: Casamento">
                </div>
            </div>

            <!-- Upload -->
            <div class="space-y-3">
                <h2 class="text-lg font-bold text-gray-800">2. Importar Extratos</h2>
                <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-[#8A05BE] rounded-2xl cursor-pointer bg-purple-50 hover:bg-purple-100 transition shadow-sm text-center px-4">
                    <svg class="w-8 h-8 text-[#8A05BE] mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="text-[#8A05BE] font-bold text-lg">Selecionar arquivos</span>
                    <span class="text-sm text-purple-500 font-medium mt-1">PDF, CSV ou OFX</span>
                    <input type="file" id="file-input" class="hidden" multiple accept="application/pdf, .pdf, text/csv, .csv, application/x-ofx, .ofx">
                </label>
            </div>

            <button onclick="processFiles()" class="w-full bg-[#8A05BE] text-white font-bold text-lg py-4 rounded-2xl shadow-xl hover:bg-purple-800 transition transform hover:scale-[1.02]">
                Analisar Arquivos
            </button>
        </div>

        <!-- Tela do Quiz -->
        <div class="p-5 hidden space-y-5" id="quiz-screen">
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">Atribuir Gastos</h2>
                <span class="bg-purple-100 text-[#8A05BE] text-sm font-black px-3 py-1 rounded-lg" id="progress-badge">0/0</span>
            </div>
            
            <div id="items-container" class="space-y-4">
                <!-- Itens serão injetados aqui -->
            </div>

            <button onclick="exportToPDF()" class="w-full bg-emerald-500 text-white font-bold text-lg py-4 rounded-2xl shadow-lg mt-8 hover:bg-emerald-600 transition flex justify-center items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Exportar Resumo (PDF)</span>
            </button>
        </div>
    </div>

    <!-- Footer Fixado com Totais -->
    <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] p-5 flex justify-between items-center z-50 rounded-t-3xl">
        <div class="flex-1">
            <p class="text-[11px] uppercase tracking-wider text-gray-400 font-bold" id="label-cat1">Cat 1</p>
            <p class="text-lg font-black text-[#8A05BE]" id="total-cat1">R$ 0,00</p>
        </div>
        <div class="flex-1 text-center">
            <p class="text-[11px] uppercase tracking-wider text-gray-400 font-bold" id="label-cat2">Cat 2</p>
            <p class="text-lg font-black text-[#8A05BE]" id="total-cat2">R$ 0,00</p>
        </div>
        <div class="flex-1 text-right">
            <p class="text-[11px] uppercase tracking-wider text-gray-400 font-bold">Total</p>
            <p class="text-lg font-black text-gray-900" id="total-geral">R$ 0,00</p>
        </div>
    </div>

    <script>
        let expenses = [];
        let category1 = "Meu Gasto";
        let category2 = "Casamento";
        let totals = { cat1: 0, cat2: 0, total: 0 };

        async function processFiles() {
            category1 = document.getElementById('cat1').value || "Pessoa A";
            category2 = document.getElementById('cat2').value || "Pessoa B";
            
            document.getElementById('label-cat1').innerText = category1;
            document.getElementById('label-cat2').innerText = category2;

            const files = document.getElementById('file-input').files;
            if (files.length === 0) return alert("Selecione pelo menos um arquivo.");

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            expenses = [];
            
            for (let file of files) {
                const fileName = file.name.toLowerCase();
                
                if (fileName.endsWith('.pdf')) {
                    await parsePDF(file);
                } else if (fileName.endsWith('.csv')) {
                    await parseCSV(file);
                } else if (fileName.endsWith('.ofx')) {
                    await parseOFX(file);
                }
            }
            renderQuiz();
        }

        async function parsePDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const fullText = textContent.items.map(item => item.str).join(' ');

                const regex = /(\d{2}\s+[A-Z]{3})\s+(.*?)\s+R\$\s*(\d+[.,]\d{2})/g;
                let match;
                
                while ((match = regex.exec(fullText)) !== null) {
                    const date = match[1].trim();
                    const desc = match[2].trim();
                    if(desc.toLowerCase().includes("pagamento em")) continue; 
                    
                    const value = parseFloat(match[3].replace('.', '').replace(',', '.'));
                    expenses.push({ id: Math.random().toString(36).substr(2, 9), date, desc, value, assignedTo: null });
                }
            }
        }

        async function parseCSV(file) {
            const text = await file.text();
            const lines = text.split('\n').filter(l => l.trim() !== '');
            if (lines.length < 2) return;
            
            const separator = lines[0].includes(';') ? ';' : ',';
            const headers = lines[0].toLowerCase().split(separator).map(h => h.replace(/"/g, '').trim());
            
            let dateIdx = 0, descIdx = -1, valIdx = -1;

            // Busca inteligente de colunas
            if (headers.includes('identificador') && headers.includes('descrição')) {
                descIdx = headers.indexOf('descrição');
                valIdx = headers.indexOf('valor');
            } else if (headers.includes('category') && headers.includes('title')) {
                descIdx = headers.indexOf('title');
                valIdx = headers.indexOf('amount');
            } else {
                headers.forEach((h, i) => {
                    if (h.includes('title') || h.includes('título') || h.includes('descri') || h.includes('historico')) descIdx = i;
                    if (h.includes('amount') || h.includes('valor')) valIdx = i;
                });
                if (descIdx === -1) descIdx = headers.length > 2 ? 2 : 1;
                if (valIdx === -1) valIdx = headers.length - 1;
            }

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                const cols = line.split(new RegExp(`${separator}(?=(?:(?:[^"]*"){2})*[^"]*$)`)).map(c => c.replace(/"/g, '').trim());
                
                if (cols.length > Math.max(dateIdx, valIdx)) {
                    const date = cols[dateIdx] || "";
                    let desc = cols[descIdx] || "Sem Nome";
                    
                    // Prevenção extra: se a descrição for apenas números (como no print), pega a coluna vizinha
                    if (!isNaN(parseFloat(desc.replace(',', '.'))) && cols.length > descIdx + 1) {
                        desc = cols[descIdx + 1] || cols[descIdx - 1]; 
                    }

                    let valStr = cols[valIdx] || "0";
                    valStr = valStr.replace(/[R$\s]/g, '');
                    
                    if (valStr.includes(',') && valStr.split(',')[1].length <= 2) {
                        valStr = valStr.replace(/\./g, '').replace(',', '.');
                    } else if (valStr.includes(',')) {
                        valStr = valStr.replace(',', '.');
                    }
                    
                    let value = parseFloat(valStr);
                    if (isNaN(value)) continue;
                    if (value < 0) value = Math.abs(value);
                    
                    if (value > 0 && !desc.toLowerCase().includes("pagamento")) {
                        expenses.push({ id: Math.random().toString(36).substr(2, 9), date, desc, value, assignedTo: null });
                    }
                }
            }
        }

        async function parseOFX(file) {
            const text = await file.text();
            const trnRegex = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
            let match;
            
            while ((match = trnRegex.exec(text)) !== null) {
                const trnBlock = match[1];
                const amtMatch = /<TRNAMT>([-\d.]+)/i.exec(trnBlock);
                const memoMatch = /<(?:MEMO|NAME)>(.*?)($|<)/i.exec(trnBlock);
                const dateMatch = /<DTPOSTED>(\d{8})/i.exec(trnBlock);
                
                if (amtMatch && memoMatch) {
                    let value = parseFloat(amtMatch[1]);
                    if (value < 0) {
                        value = Math.abs(value);
                        const desc = memoMatch[1].trim();
                        let date = "Data";
                        if (dateMatch) {
                            const d = dateMatch[1];
                            date = `${d.substring(6,8)}/${d.substring(4,6)}/${d.substring(0,4)}`;
                        }
                        if (!desc.toLowerCase().includes("pagamento")) {
                            expenses.push({ id: Math.random().toString(36).substr(2, 9), date, desc, value, assignedTo: null });
                        }
                    }
                }
            }
        }

        function renderQuiz() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            let assignedCount = expenses.filter(e => e.assignedTo !== null).length;
            document.getElementById('progress-badge').innerText = `${assignedCount}/${expenses.length}`;

            const sortedExpenses = [...expenses].sort((a, b) => b.value - a.value);

            sortedExpenses.forEach((item) => {
                const div = document.createElement('div');
                div.className = "bg-white border border-gray-100 rounded-2xl p-5 shadow-sm transition-all";
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4 gap-3">
                        <div class="flex-1 min-w-0">
                            <span class="text-[11px] text-gray-400 font-bold uppercase tracking-wider bg-gray-50 px-2 py-1 rounded-md">${item.date}</span>
                            <p class="text-base font-bold text-gray-800 leading-snug mt-2 truncate">${item.desc}</p>
                        </div>
                        <span class="text-lg font-black text-gray-900 whitespace-nowrap bg-purple-50 text-[#8A05BE] px-3 py-1.5 rounded-xl">R$ ${item.value.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <button onclick="assignItem('${item.id}', 'cat1')" class="py-3 rounded-xl text-sm font-bold border-2 transition-all ${item.assignedTo === 'cat1' ? 'bg-[#8A05BE] text-white border-[#8A05BE] shadow-md transform scale-[1.02]' : 'bg-white text-gray-600 border-gray-100 hover:border-gray-200'}">
                            ${category1}
                        </button>
                        <button onclick="assignItem('${item.id}', 'cat2')" class="py-3 rounded-xl text-sm font-bold border-2 transition-all ${item.assignedTo === 'cat2' ? 'bg-[#8A05BE] text-white border-[#8A05BE] shadow-md transform scale-[1.02]' : 'bg-white text-gray-600 border-gray-100 hover:border-gray-200'}">
                            ${category2}
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
            updateTotals();
        }

        function assignItem(id, cat) {
            const item = expenses.find(e => e.id === id);
            if (item) {
                item.assignedTo = cat;
                renderQuiz();
            }
        }

        function updateTotals() {
            totals = { cat1: 0, cat2: 0, total: 0 };
            expenses.forEach(item => {
                totals.total += item.value;
                if (item.assignedTo === 'cat1') totals.cat1 += item.value;
                if (item.assignedTo === 'cat2') totals.cat2 += item.value;
            });

            document.getElementById('total-cat1').innerText = `R$ ${totals.cat1.toFixed(2).replace('.', ',')}`;
            document.getElementById('total-cat2').innerText = `R$ ${totals.cat2.toFixed(2).replace('.', ',')}`;
            document.getElementById('total-geral').innerText = `R$ ${totals.total.toFixed(2).replace('.', ',')}`;
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(22);
            doc.setTextColor(138, 5, 190);
            doc.text("Resumo de Fatura", 14, 22);
            
            doc.setFontSize(11);
            doc.setTextColor(50, 50, 50);
            doc.text(`Total Geral: R$ ${totals.total.toFixed(2).replace('.', ',')}`, 14, 34);
            doc.text(`Total ${category1}: R$ ${totals.cat1.toFixed(2).replace('.', ',')}`, 14, 40);
            doc.text(`Total ${category2}: R$ ${totals.cat2.toFixed(2).replace('.', ',')}`, 14, 46);

            const tableData = expenses.map(item => [
                item.date,
                item.desc,
                item.assignedTo === 'cat1' ? category1 : (item.assignedTo === 'cat2' ? category2 : 'Não atribuído'),
                `R$ ${item.value.toFixed(2).replace('.', ',')}`
            ]);

            doc.autoTable({
                startY: 54,
                head: [['Data', 'Descrição', 'Categoria', 'Valor']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [138, 5, 190], textColor: [255, 255, 255], fontStyle: 'bold' },
                styles: { fontSize: 10, cellPadding: 4 },
                alternateRowStyles: { fillColor: [250, 245, 255] }
            });

            doc.save(`Divisao_Gastos_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.pdf`);
        }
    </script>
</body>
</html>
